# VSCode 拡張のベースライン。どのマシンにも入れるものだけを書く。
# インストールスクリプトは不足分を入れるだけでアンインストールはしないので、
# ここに無い拡張を各マシンで足しても消されない。
[vscode]
extensions = [
	"anthropic.claude-code",
	"asarchy.vscode-serve-sim",
	"diemasmichiels.emulate",
	"eamodio.gitlens",
	"github.vscode-github-actions",
	"hediet.vscode-drawio",
	"jebbs.plantuml",
	"jetbrains.kotlin",
	"kangsou.islands-theme",
	"l-igh-t.vscode-theme-seti-folder",
	"llvm-vs-code-extensions.lldb-dap",
	"mateocerquetella.xcode-12-theme",
	"ms-vscode-remote.remote-containers",
	"ms-vscode-remote.remote-ssh",
	"ms-vscode-remote.remote-ssh-edit",
	"ms-vscode.remote-explorer",
	"sweetpad.sweetpad",
	"swiftlang.swift-vscode",
	"vadimcn.vscode-lldb",
]
