[[packages]]
name = "chezmoi"
description = "dotfiles manager"
brew = "chezmoi"
winget = "twpayne.chezmoi"

[[packages]]
name = "starship"
description = "cross-shell prompt"
brew = "starship"
winget = "Starship.Starship"

[[packages]]
name = "neovim"
description = "editor (設定は AstroNvim)"
brew = "neovim"
winget = "Neovim.Neovim"

[[packages]]
name = "visual-studio-code"
description = "editor"
brew = "visual-studio-code"
winget = "Microsoft.VisualStudioCode"

[[packages]]
name = "ripgrep"
description = "fast grep"
brew = "ripgrep"
winget = "BurntSushi.ripgrep.MSVC"

[[packages]]
name = "tree-sitter"
description = "parser generator CLI"
brew = "tree-sitter"
winget = "tree-sitter.tree-sitter-cli"

[[packages]]
name = "ghostty"
description = "terminal emulator"
# winget に無い (Windows 版が存在しない) ため macOS のみ
brew = "ghostty"

[[packages]]
name = "lazygit"
description = "git TUI (herdr の prefix+shift+l から開く)"
brew = "lazygit"
winget = "JesseDuffield.lazygit"

[[packages]]
name = "fzf"
description = "fuzzy finder (cd-dev の dev から使う)"
brew = "fzf"
winget = "junegunn.fzf"

[[packages]]
name = "gh"
description = "GitHub CLI"
brew = "gh"
winget = "GitHub.cli"

[[packages]]
name = "ghq"
description = "repository manager"
brew = "ghq"
winget = "x-motemen.ghq"

[[packages]]
name = "google-chrome"
description = "web browser"
brew = "google-chrome"
winget = "Google.Chrome"

[[packages]]
name = "karabiner-elements"
description = "keyboard customizer"
brew = "karabiner-elements"

[[packages]]
name = "logitech-g-hub"
description = "Logitech device manager"
brew = "logitech-g-hub"
winget = "Logitech.GHUB"

# 公式インストーラで入れると brew の管理下に入らず、毎回 brew install を
# 試みて sudo で失敗し続ける。/Applications/<app>.app があれば導入済みと見なす
app = "lghub"

[[packages]]
name = "herdr"
description = "terminal agent manager"
brew = "herdr"

# winget に無いため公式インストーラで入れる (https://herdr.dev/docs/install/)
[packages.windows]
script = "irm https://herdr.dev/install.ps1 | iex"
check = "herdr"

[[packages]]
name = "7zip"
description = "archiver"
winget = "7zip.7zip"
